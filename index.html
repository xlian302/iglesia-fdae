<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FDAE WEB.SERVICE</title>

<style>

/* ================= GENERAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    padding:20px;
    background:#111;
    border-bottom:2px solid #222;
}

.logo{
    width:70px;
    height:70px;
    border-radius:50%;
    object-fit:cover;
}

.titulo{
    font-size:30px;
    font-weight:bold;
    text-align:center;
}

/* ================= PANTALLAS ================= */

.pantalla{
    display:none;
    min-height:100vh;
    min-height:100dvh;
    padding:30px;
}

.activo{
    display:block;
}

/* ================= MENU ================= */

.menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    margin-top:50px;
}

.btn{
    width:220px;
    height:220px;
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    user-select:none;
}

.btn:hover,
.btn-letra-musica:hover{
    transform:scale(1.05);
}

.azul{
    background:#3498db;
}

.verde{
    background:#2ecc71;
}

.naranja{
    background:#e67e22;
}

/* ================= INPUTS ================= */

input,
button{
    padding:12px;
    border:none;
    border-radius:10px;
    margin:10px;
    font-size:18px;
}

button{
    cursor:pointer;
}

/* ================= VISOR ================= */

#visorBiblia,
#visorHimno,
#resultadosBusqueda{
    width:100%;
    max-width:2000px;
    min-width:0;
    margin:auto;
    margin-top:25px;
}

/* ================= VERSICULOS ================= */

.versiculo{
    background:#111;
    margin:14px 0;
    padding:22px 28px;
    border-left:5px solid #3498db;
    border-radius:12px;
    text-align:left;
    font-size:23px;
    line-height:1.85;
    letter-spacing:0.3px;
    max-width:100%;
    min-width:0;
    word-wrap:break-word;
    overflow-wrap:break-word;
}

.num{
    color:#3498db;
    font-weight:bold;
    margin-right:10px;
}

.versiculo.destacado{
    background:#16233f;
    border-left-color:#ffd700;
    box-shadow:0 0 18px rgba(255,215,0,0.25);
}

/* ================= HIMNOS ================= */

pre{
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow-wrap:break-word;
    text-align:left;
    background:#111;
    padding:26px 28px;
    border-radius:12px;
    font-size:22px;
    line-height:1.9;
    max-width:100%;
    min-width:0;
}

/* ================= BUSCADOR ================= */

.resultado-busqueda{
    background:#111;
    margin:15px 0;
    padding:22px 28px;
    border-left:5px solid #e67e22;
    border-radius:12px;
    text-align:left;
    font-size:21px;
    line-height:1.8;
    max-width:100%;
    min-width:0;
    word-wrap:break-word;
    overflow-wrap:break-word;
}

/* ================= PREDICADOR ================= */

.predicador-lista{
    width:100%;
    padding:40px 16px;
}

.predica-item{

    min-height:100vh;

    min-height:100dvh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    margin:0;

    padding:60px 24px;

    opacity:0.15;

    transform:scale(0.82);

    transition:
        opacity 0.4s,
        transform 0.4s;

    text-align:center;

}

.versiculo-activo{

    opacity:1;

    transform:scale(1);

.coro-activo{

    border-left:8px solid #2ecc71;

    padding-left:30px;

}

}

.predica-ref{

    font-size:clamp(16px, min(2.6vw, 4.5vh), 42px);

    color:#3498db;

    margin-bottom:35px;

    font-weight:bold;

}

.predica-texto{

    font-size:clamp(22px, min(4.6vw, 7.5vh), 85px);

    line-height:1.55;

    font-weight:bold;

    width:100%;

    max-width:1800px;

    margin:auto;

    word-wrap:break-word;

    overflow-wrap:break-word;

}

/* ================= FLECHAS ================= */

.flecha-control{

    position:fixed;

    z-index:999999999;

    right:25px;

    width:85px;

    height:85px;

    border-radius:50%;

    background:rgba(20,20,20,0.95);

    border:4px solid #3498db;

    color:#3498db;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:45px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    user-select:none;

    box-shadow:
        0 0 25px rgba(0,0,0,0.8),
        0 0 15px #3498db;

    backdrop-filter:blur(8px);

}

.flecha-control:hover{

    background:#3498db;

    color:#fff;

    transform:scale(1.1);

}

#flechaArriba{

    bottom:150px;

}

#flechaAbajo{

    bottom:40px;

}

/* ================= INDICADOR ================= */

.indicador-versiculo{

    position:fixed;

    top:20px;

    right:20px;

    z-index:999999999;

    background:rgba(0,0,0,0.8);

    border:2px solid #3498db;

    color:#fff;

    padding:12px 20px;

    border-radius:15px;

    font-size:20px;

    font-weight:bold;

    backdrop-filter:blur(8px);

}

/* ================= ANIMACION ================= */

@keyframes aparecer{

    from{

        opacity:0;
        transform:translateY(30px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}

.versiculo-activo .predica-texto{

    animation:aparecer 0.4s ease;

}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    .pantalla{
        padding:20px 16px;
    }

    .versiculo{
        font-size:20px;
        padding:18px 20px;
    }

    pre{
        font-size:19px;
        padding:20px;
    }

    .predica-item{
        padding:40px 16px;
    }

    .btn{
        width:170px;
        height:170px;
        font-size:20px;
    }

    .titulo{
        font-size:22px;
    }

    .flecha-control{

        width:65px;

        height:65px;

        font-size:32px;

        right:15px;

    }

    #flechaArriba{

        bottom:110px;

    }

    #flechaAbajo{

        bottom:25px;

    }

}

/*ESTO ES PARA LA PARTE DONDE SE AGG LAS LETRAS DE LAS MUSICAS PARA PROYECTARLAS */
.letras-barra{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin:15px 0;
}

.letras-grid{
    display:grid;
    grid-template-columns:260px 1fr 340px;
    gap:20px;
    margin-top:20px;
}

.letras-panel{
    background:#111;
    border:1px solid #262626;
    border-radius:15px;
    padding:18px;
}

.diapositiva-card{
    background:#1b1b1b;
    border:2px solid #2c2c2c;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
}

.diapositiva-card.activa{
    border-color:#2ecc71;
    background:#15291e;
}

.editor-diapositiva{
    width:100%;
    min-height:260px;
    margin:10px 0;
    background:#1a1a1a;
    color:#fff;
    border:1px solid #333;
    border-radius:10px;
    padding:12px;
    font-size:18px;
    resize:vertical;
    line-height:1.6;
}

.preview-diapositiva{
    min-height:260px;
    background:#000;
    border:2px solid #333;
    border-radius:12px;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:bold;
    white-space:pre-wrap;
    word-break:break-word;
}

.busqueda-canciones{
    position:relative;
    z-index:20;
    display:inline-flex;
    margin:10px;
}

.busqueda-canciones input{
    width:260px;
    margin:0;
}

.resultados-canciones{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    left:0;
    width:100%;
    max-height:240px;
    overflow-y:auto;
    background:#111;
    border:1px solid #333;
    border-radius:10px;
    box-shadow:0 10px 28px rgba(0,0,0,0.45);
}

.resultados-canciones.visible{
    display:block;
}

.estado-resultados-canciones{
    padding:10px 12px;
    color:#aaa;
    font-size:14px;
    border-bottom:1px solid #292929;
}

.resultado-cancion{
    display:block;
    width:100%;
    margin:0;
    padding:11px 12px;
    border-radius:0;
    background:transparent;
    color:#fff;
    text-align:left;
    font-size:16px;
}

.resultado-cancion:hover,
.resultado-cancion:focus{
    background:#1d5f45;
    outline:none;
}

.selector-animacion{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:bold;
}

.selector-animacion select{
    margin:0;
    padding:12px;
    background:#1c1c1c;
    color:#fff;
    border:1px solid #333;
    border-radius:10px;
    font-size:18px;
}

#proyeccionLetras{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    color:#fff;
    z-index:1000000000;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px;
    overflow:hidden;
    isolation:isolate;
}

#proyeccionLetras.activa{
    display:flex;
}

#proyeccionLetras::before,
#proyeccionLetras::after{
    content:"";
    position:absolute;
    inset:-18%;
    pointer-events:none;
    z-index:0;
}

#proyeccionLetras > *{
    position:relative;
    z-index:1;
}

#proyeccionLetras .proy-cancion,
#proyeccionLetras .proy-texto{
    position:relative;
    z-index:3;
}

@media(hover:hover) and (pointer:fine){
    #proyeccionLetras .proy-texto{
        cursor:none;
    }
}

.palabra-proyeccion{
    position:relative;
    display:inline-block;
    border-radius:0.18em;
    transition:
        color 0.12s ease,
        background-color 0.12s ease,
        text-shadow 0.12s ease,
        box-shadow 0.12s ease;
}

.palabra-proyeccion:hover{
    color:#fff4a8;
    background:rgba(255,224,92,0.28);
    text-shadow:
        0 0 10px rgba(255,224,92,0.8),
        0 2px 5px rgba(0,0,0,0.95);
    box-shadow:0 0 14px rgba(255,224,92,0.28);
}

.palabra-proyeccion:hover::after{
    content:"";
    position:absolute;
    left:0.04em;
    right:0.04em;
    bottom:-0.02em;
    height:0.09em;
    background:#ffe45f;
    border-radius:999px;
    box-shadow:0 0 8px rgba(255,228,95,0.95);
}

#proyeccionLetras.animacion-olas{
    background:linear-gradient(180deg, #031426 0%, #064667 48%, #010812 100%);
    box-shadow:inset 0 0 180px rgba(0,0,0,0.65);
}

#proyeccionLetras.animacion-olas::before{
    inset:34% -18% -22%;
    background:
        radial-gradient(ellipse at 18% 70%, rgba(51,199,226,0.55), transparent 53%),
        radial-gradient(ellipse at 80% 48%, rgba(20,112,171,0.78), transparent 56%),
        repeating-linear-gradient(
            176deg,
            transparent 0 22px,
            rgba(165,240,255,0.18) 23px 27px,
            transparent 28px 74px
        );
    background-size:118% 100%, 130% 100%, 145% 100%;
    background-position:0 0, 100% 10%, 0 0;
    border-radius:50% 50% 0 0 / 18% 18% 0 0;
    filter:blur(1px);
    mix-blend-mode:screen;
    animation:moverOlas 12s ease-in-out infinite alternate;
    opacity:0.9;
}

#proyeccionLetras.animacion-olas::after{
    inset:50% -22% -14%;
    background:
        repeating-linear-gradient(
            172deg,
            rgba(194,246,255,0.2) 0 2px,
            transparent 3px 32px
        ),
        repeating-linear-gradient(
            8deg,
            transparent 0 20px,
            rgba(102,218,245,0.15) 21px 24px,
            transparent 25px 58px
        );
    background-size:180% 100%, 160% 100%;
    filter:blur(0.5px);
    mix-blend-mode:screen;
    animation:brilloOlas 8s linear infinite;
    opacity:0.72;
}

#proyeccionLetras .proy-cancion,
#proyeccionLetras .proy-texto{
    text-shadow:
        0 4px 18px rgba(0,0,0,0.6),
        0 1px 4px rgba(0,0,0,0.95);
}

@keyframes moverOlas{
    0%{
        transform:translate3d(-4%, 4%, 0) rotate(-2deg) scale(1.08);
        background-position:0 0, 100% 10%, 0 0;
    }
    50%{
        transform:translate3d(2%, -1%, 0) rotate(0deg) scale(1.12);
        background-position:5% -4%, 94% 4%, 42px 12px;
    }
    100%{
        transform:translate3d(5%, -4%, 0) rotate(2deg) scale(1.16);
        background-position:10% 2%, 88% -3%, 84px 24px;
    }
}

@keyframes brilloOlas{
    from{
        transform:translate3d(-8%, 3%, 0) skewX(-3deg);
        background-position:0 0, 100% 0;
    }
    to{
        transform:translate3d(8%, -3%, 0) skewX(3deg);
        background-position:180px -24px, -120px 18px;
    }
}

#proyeccionLetras.animacion-cielo{
    background:linear-gradient(180deg, #1d5d9d 0%, #75b9e4 55%, #f1cf91 100%);
}

#proyeccionLetras.animacion-cielo::before{
    background:
        radial-gradient(ellipse at 18% 30%, rgba(255,255,255,0.85) 0 7%, transparent 22%),
        radial-gradient(ellipse at 72% 42%, rgba(255,255,255,0.7) 0 8%, transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(255,239,175,0.9), transparent 12%);
    filter:blur(12px);
    animation:moverNubes 26s ease-in-out infinite alternate;
}

#proyeccionLetras.animacion-cielo::after{
    background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.18), transparent 64%);
    animation:pasarLuz 12s ease-in-out infinite alternate;
}

#proyeccionLetras.animacion-naturaleza{
    background:linear-gradient(180deg, #142f32 0%, #276044 58%, #06160e 100%);
}

#proyeccionLetras.animacion-naturaleza::before{
    background:
        radial-gradient(circle at 76% 22%, rgba(255,221,126,0.55), transparent 13%),
        radial-gradient(ellipse at 10% 100%, rgba(18,92,57,0.9), transparent 50%),
        radial-gradient(ellipse at 90% 100%, rgba(9,54,40,0.9), transparent 48%);
    animation:respirarNaturaleza 11s ease-in-out infinite alternate;
}

#proyeccionLetras.animacion-naturaleza::after{
    background:
        radial-gradient(circle at 20% 28%, rgba(222,255,162,0.6) 0 2px, transparent 4px),
        radial-gradient(circle at 68% 72%, rgba(222,255,162,0.5) 0 2px, transparent 4px),
        radial-gradient(circle at 86% 36%, rgba(222,255,162,0.55) 0 2px, transparent 4px);
    animation:luciernagas 8s ease-in-out infinite alternate;
}

#proyeccionLetras.animacion-noche{
    background:radial-gradient(circle at 72% 18%, #273f7a 0%, #0b122b 38%, #010208 100%);
}

#proyeccionLetras.animacion-noche::before{
    background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,0.9) 0 1px, transparent 2px),
        radial-gradient(circle at 34% 68%, rgba(255,255,255,0.75) 0 1px, transparent 2px),
        radial-gradient(circle at 62% 32%, rgba(255,255,255,0.9) 0 1px, transparent 2px),
        radial-gradient(circle at 88% 60%, rgba(255,255,255,0.7) 0 1px, transparent 2px);
    background-size:180px 160px, 240px 210px, 210px 180px, 260px 230px;
    animation:parpadearEstrellas 7s ease-in-out infinite alternate;
}

#proyeccionLetras.animacion-noche::after{
    background:radial-gradient(circle at 76% 20%, rgba(255,248,202,0.9) 0 4%, rgba(255,248,202,0.16) 5% 12%, transparent 25%);
    animation:brilloLuna 9s ease-in-out infinite alternate;
}

#proyeccionLetras.animacion-olas .proy-cancion{
    color:#b9f4ff;
}

#proyeccionLetras.animacion-cielo .proy-cancion{
    color:#fff1bf;
}

#proyeccionLetras.animacion-naturaleza .proy-cancion{
    color:#d9ffae;
}

#proyeccionLetras.animacion-noche .proy-cancion{
    color:#dce7ff;
}

.proy-cancion{
    font-size:clamp(18px, 2.5vw, 34px);
    color:#2ecc71;
    font-weight:bold;
    margin-bottom:25px;
}

.proy-texto{
    font-size:clamp(28px, 5vw, 82px);
    font-weight:bold;
    line-height:1.5;
    max-width:95%;
    white-space:pre-wrap;
    word-break:break-word;
}

.proy-texto.cambiando{
    animation:entradaDiapositiva 0.55s ease both;
}

@keyframes moverNubes{
    from{transform:translateX(-8%) scale(1.05);}
    to{transform:translateX(8%) scale(1.12);}
}

@keyframes pasarLuz{
    from{transform:translateX(-16%); opacity:0.25;}
    to{transform:translateX(16%); opacity:0.8;}
}

@keyframes respirarNaturaleza{
    from{transform:scale(1); opacity:0.72;}
    to{transform:scale(1.1); opacity:1;}
}

@keyframes luciernagas{
    from{transform:translate(0, 4%); opacity:0.35;}
    to{transform:translate(2%, -5%); opacity:0.9;}
}

@keyframes parpadearEstrellas{
    from{opacity:0.45; transform:scale(1);}
    to{opacity:0.95; transform:scale(1.04);}
}

@keyframes brilloLuna{
    from{transform:scale(0.96); opacity:0.65;}
    to{transform:scale(1.06); opacity:1;}
}

@keyframes entradaDiapositiva{
    from{opacity:0; transform:translateY(14px) scale(0.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
}

@media(prefers-reduced-motion:reduce){
    #proyeccionLetras::before,
    #proyeccionLetras::after,
    .proy-texto.cambiando{
        animation:none !important;
    }
}

@media(max-width:1024px){
    .letras-grid{
        grid-template-columns:1fr;
    }
}


</style>

</head>

<body>

<!-- ================= INICIO ================= -->

<div id="inicio" class="pantalla activo">

    <div class="header">

        <img src="logo.png" class="logo">

        <div class="titulo">
            IGLESIA EVANGÉLICA MISIONERA FDAE
        </div>

    </div>

    <div class="menu">

        <div class="btn azul" onclick="ir('biblia')">
            📖<br>BIBLIA
        </div>

        <div class="btn verde" onclick="ir('himnos')">
            🎵<br>HIMNARIO
        </div>

        <div class="btn naranja" onclick="ir('buscador')">
            🔍<br>BUSCADOR
        </div>

        <div class="btn-letra-musica">

            <button
            onclick="abrirLetras()"
            style="
            width:220px;
            height:220px;
            border-radius:25px;
            display:flex;
            justify-content:center;
            flex-direction:column;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
            user-select:none;
            background: green;
            color: white;
            font-size: 25px;
            font-weight: bold;
            margin-top: 0;"
            >
                🎼<br>LETRAS
            </button>
        </div>

    </div>

</div>

<!-- ================= BIBLIA ================= -->

<div id="biblia" class="pantalla">

    <button onclick="ir('inicio')">
        ← VOLVER
    </button>

    <h1>BIBLIA RV1960</h1>

    <input
        id="busquedaBiblia"
        placeholder="Ej: juan 3 o juan 3:16"
        autocomplete="off"
    >

    <button onclick="cargarCapitulo()">
        BUSCAR
    </button>

    <button onclick="activarPredicador()">
        PROYECTAR
    </button>

    <div id="visorBiblia"></div>

</div>

<!-- ================= HIMNOS ================= -->

<div id="himnos" class="pantalla">

    <button onclick="ir('inicio')">
        ← VOLVER
    </button>

    <h1>HIMNARIO</h1>

    <input
        id="numHimno"
        placeholder="Número del himno"
        autocomplete="off"
    >

    <button onclick="buscarHimno()">
        BUSCAR
    </button>

    <button onclick="activarPredicadorHimno()">
        PROYECTAR
    </button>

    <div id="visorHimno"></div>

</div>


<!--ESTA PARTE ES LA FUNCIONALIDAD DE LA PARTE DE PROYECTAR LETRAS MUSICALES-->
<div id="letras" class="pantalla">

    <button onclick="ir('inicio')">
        ← VOLVER
    </button>

    <h1>LETRAS DE CANCIONES</h1>

    <div class="letras-barra">
        <input id="tituloCancion" placeholder="Título de la canción" autocomplete="off">
        <button onclick="guardarCancion()" style="background:#2ecc71; color:#000; font-weight:bold;">💾 GUARDAR</button>
        <div class="busqueda-canciones">
            <input id="busquedaCanciones" placeholder="Buscar canción..." autocomplete="off" oninput="filtrarCancionesGuardadas()" onkeydown="navegarCancionesGuardadas(event)">
            <div id="resultadosCanciones" class="resultados-canciones" aria-live="polite"></div>
        </div>

<script>

function dividirHimno(letra){

    letra = letra.replace(/\r/g,"");

    let coro = "";

    let coroMatch =
        letra.match(
            /CORO([\s\S]*?)(?=\n\d+\.\s|$)/i
        );

    if(coroMatch){

        coro =
            "CORO\n" +
            coroMatch[1].trim();

    }

    let estrofas =
        letra.match(
            /\d+\.[\s\S]*?(?=\n\d+\.\s|$)/g
        ) || [];

    let resultado = [];

    estrofas.forEach((e,i)=>{

        resultado.push(
            e.trim()
        );

        if(coro){

            resultado.push(
                coro
            );

        }

    });

    return resultado;

}

function activarPredicadorHimno(){

    let numero =
        document
        .getElementById("numHimno")
        .value
        .trim();

    let h = HIMNOS[numero];

    if(!h){

        alert(
            "Busca un himno primero"
        );

        return;

    }

    tituloHimno =
        h.titulo;

    partesHimno =
        dividirHimno(
            h.letra
        );

    indiceHimno = 0;

    modoHimno = true;

    document.body.style.overflow =
        "auto";

    mostrarFlechas();

    renderPredicadorHimno();

}

function renderPredicadorHimno(){

    let html = `
        <div class="predicador-lista">
    `;

    partesHimno.forEach((p,i)=>{

        let activo =
            i === indiceHimno
            ? "versiculo-activo"
            : "";

        let coro =
            p.startsWith("CORO")
            ? "coro-activo"
            : "";

        html += `

            <div
                class="
                    predica-item
                    ${activo}
                    ${coro}
                "
                id="himno-${i}"
            >

                <div class="predica-ref">

                    🎵
                    ${tituloHimno}

                </div>

                <div class="predica-texto">

                    ${p.replace(
                        /\n/g,
                        "<br>"
                    )}

                </div>

            </div>

        `;

    });

    html += `
        </div>
    `;

    document
        .getElementById(
            "visorHimno"
        )
        .innerHTML = html;

    actualizarActivoHimno();

}

function actualizarActivoHimno(){

    document
        .querySelectorAll(
            '[id^="himno-"]'
        )
        .forEach(el=>{

            el.classList.remove(
                "versiculo-activo"
            );

        });

    let actual =
        document
        .getElementById(
            `himno-${indiceHimno}`
        );

    if(actual){

        actual.classList.add(
            "versiculo-activo"
        );

        ajustarTextoPredicador(actual);

        actual.scrollIntoView({

            behavior:"smooth",

            block:"center"

        });

    }

    document
        .getElementById(
            "indicadorVersiculo"
        )
        .innerHTML = `
            🎵
            ${indiceHimno+1}
            /
            ${partesHimno.length}
        `;

}

function siguienteHimno(){

    if(
        indiceHimno <
        partesHimno.length - 1
    ){

        indiceHimno++;

        actualizarActivoHimno();

    }

}

function anteriorHimno(){

    if(indiceHimno > 0){

        indiceHimno--;

        actualizarActivoHimno();

    }

}

function controlAnterior(){

    if(modoHimno){

        anteriorHimno();

    }else{

        versiculoAnterior();

    }

}

function controlSiguiente(){

    if(modoHimno){

        siguienteHimno();

    }else{

        versiculoSiguiente();

    }

}

</script>

/* ================= VARIABLES ================= */

let versiculos = [];

function limpiar(txt){

        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

}

/* ================= CARGAR CAPITULO ================= */

function cargarCapitulo(){

    let input = limpiar(

    );

    let partes = input
        .split(" ")
        .filter(p => p !== "");

    if(partes.length < 2){

        alert("Escribe: libro + capítulo (ej: juan 3 o juan 3:16)");
        return;

    }

    let versDeseadoLocal = null;

    let ultimo = partes[partes.length - 1];

    let mVers = ultimo.match(/^(\d+):(\d+)$/);

    let cap;
    let libro;

    if(mVers){

        cap = mVers[1];
        versDeseadoLocal = mVers[2];
        libro = partes.slice(0, -1).join(" ");

    }else{

        cap = partes.pop();
        libro = partes.join(" ");

    }

    let libroReal = libro.replace(/ /g, "_");

    if(!BIBLIA[libroReal]){

        return;

    }

    if(!BIBLIA[libroReal][cap]){

        alert("❌ Capítulo no encontrado");

    }

    if(versDeseadoLocal && !BIBLIA[libroReal][cap][versDeseadoLocal]){

    libroActual = libroReal.replace(/_/g, " ");

    versiculos = Object.entries(
        BIBLIA[libroReal][cap]
    );

    indice = 0;
    indiceInicial = 0;

    if(versDeseado){

        versiculos.forEach((v, i) => {

/* ================= AJUSTAR TEXTO A PANTALLA ================= */

function ajustarTextoPredicador(item){

    if(!item) return;

    let texto = item.querySelector(".predica-texto");

    if(!texto) return;

    let ref = item.querySelector(".predica-ref");

    texto.style.fontSize = "";

    let altoDisponible =
        window.innerHeight -
        (ref ? ref.offsetHeight : 0) -
        130;

    let anchoDisponible =
        texto.clientWidth;

    if(altoDisponible < 80){

        altoDisponible = 80;

    }

    let fs =
        parseFloat(
            getComputedStyle(texto).fontSize
        ) || 60;

    while(fs > 14){

        texto.style.fontSize = fs + "px";

        if(
            texto.scrollHeight <= altoDisponible &&
            texto.scrollWidth <= anchoDisponible
        ){

            break;

        }

        fs -= 2;

    }

}

/* ================= TECLADO ================= */

document.addEventListener("keydown", e => {

    let proyeccionLetras = document.getElementById("proyeccionLetras");

    if(proyeccionLetras && proyeccionLetras.classList.contains("activa")){

        return;

    }

    let modoPredicador =
        document.getElementById("flechaAbajo")
        .style.display === "flex";

    if(modoPredicador){

        if(
            e.key === "ArrowRight" ||
            e.key === "ArrowDown" ||
            e.code === "Space"
        ){

            e.preventDefault();

            controlSiguiente();

        }

        if(
            e.key === "ArrowLeft" ||
            e.key === "ArrowUp"
        ){

            e.preventDefault();

            controlAnterior();

        }

        if(e.key === "Home"){

            if(modoHimno){

                indiceHimno = 0;

                actualizarActivoHimno();

            }else{

                indice = 0;

                actualizarActivo();

            }

        }

        if(e.key === "End"){

            if(modoHimno){

                indiceHimno = partesHimno.length - 1;

                actualizarActivoHimno();

            }else{

                indice = versiculos.length - 1;

                actualizarActivo();

            }

        }

        if(e.key === "Escape"){

            salirPredicador();

        }

    }

});

/* ================= BUSCADOR ================= */

function buscarTextoBiblico(){

    let texto = limpiar(
        document.getElementById("textoBusqueda").value
    );

    if(texto === ""){

        alert("Escribe algo para buscar");
        return;

    }

    let resultados = [];

    for(let libro in BIBLIA){

        for(let capitulo in BIBLIA[libro]){

            for(let versiculo in BIBLIA[libro][capitulo]){

                let contenido =
                    BIBLIA[libro][capitulo][versiculo];

                let limpio = limpiar(contenido);

                if(limpio.includes(texto)){

                    resultados.push({

                        libro,
                        capitulo,
                        versiculo,
                        contenido

                    });

                }

            }

        }

    }

    mostrarResultadosBusqueda(resultados);

}

/* ================= RESULTADOS ================= */

function mostrarResultadosBusqueda(resultados){

    let visor =
        document.getElementById("resultadosBusqueda");

    if(resultados.length === 0){

        visor.innerHTML =
            "<h2>❌ No se encontraron resultados</h2>";

        return;

    }

    let html = `
        <h2>
            Resultados encontrados:
            ${resultados.length}
        </h2>
    `;

    resultados
        .slice(0,200)
        .forEach(r => {

        html += `

            <div class="resultado-busqueda">

                <b>
                    ${r.libro.replace(/_/g, " ")}
                    ${r.capitulo}:${r.versiculo}
                </b>

                <br><br>

                ${r.contenido}

            </div>

        `;

    });

    visor.innerHTML = html;

}

/* ================= LETRAS ================= */

function normalizarAnimacionLetra(estilo){

    return ESTILOS_ANIMACION_LETRA.includes(estilo)
        ? estilo
        : "olas";

}

function leerCancionesLetras(){

    try{

        let guardadas = JSON.parse(
            localStorage.getItem(CLAVE_CANCIONES_LETRAS) || "[]"
        );

        if(!Array.isArray(guardadas)){

            return [];

        }

        return guardadas
            .filter(c =>
                c &&
                typeof c.id === "string" &&
                typeof c.titulo === "string"
            )
            .map(c => ({
                id: c.id,
                titulo: c.titulo.trim(),
                diapositivas: Array.isArray(c.diapositivas)
                    ? c.diapositivas.map(texto =>
                        texto == null ? "" : String(texto)
                    )
                    : [],
                tamano: Number.isFinite(Number(c.tamano))
                    ? Number(c.tamano)
                    : 64,
                animacion: normalizarAnimacionLetra(c.animacion)
            }))
            .filter(c => c.titulo && c.diapositivas.length > 0);

    }catch(error){

        console.error("No se pudieron leer las canciones guardadas", error);
        return [];

    }

}

function guardarCancionesLetras(){

    try{

        localStorage.setItem(
            CLAVE_CANCIONES_LETRAS,
            JSON.stringify(cancionesLetras)
        );

        return true;

    }catch(error){

        console.error("No se pudieron guardar las canciones", error);
        alert("No se pudo guardar la canción en este navegador");
        return false;

    }

}

function abrirLetras(){

    ir("letras");
    modoHimno = false;
    ocultarFlechas();
    actualizarSelectorCanciones();
    renderizarEditorLetras();
    renderizarResultadosCanciones();

}

function actualizarSelectorCanciones(){

    let selector = document.getElementById("selectorCanciones");

    if(!selector){

        return;

    }

    cancionesLetras = leerCancionesLetras();

    selector.innerHTML = "";

    let inicial = document.createElement("option");
    inicial.value = "";
    inicial.textContent = "-- Canciones guardadas --";
    selector.appendChild(inicial);

    let filtro = limpiar(filtroCancionesGuardadas);
    let cancionesVisibles = cancionesLetras.filter(cancion =>
        !filtro || limpiar(cancion.titulo).includes(filtro)
    );

    cancionesVisibles.forEach(cancion => {

        let opcion = document.createElement("option");
        opcion.value = "local:" + cancion.id;
        opcion.textContent = cancion.titulo;
        selector.appendChild(opcion);

    });

    let cancionActualExiste = cancionesLetras.some(c =>
        "local:" + c.id === cancionLetraActual
    );

    if(!cancionActualExiste){

        cancionLetraActual = "";

    }

    if(cancionLetraActual &&
       cancionesVisibles.some(c => "local:" + c.id === cancionLetraActual)){

        selector.value = cancionLetraActual;

    }else{

        selector.value = "";

    }

}

function filtrarCancionesGuardadas(){

    let busqueda = document.getElementById("busquedaCanciones");
    filtroCancionesGuardadas = busqueda ? busqueda.value : "";
    actualizarSelectorCanciones();
    renderizarResultadosCanciones();

}

function renderizarResultadosCanciones(){

    let lista = document.getElementById("resultadosCanciones");
    let busqueda = document.getElementById("busquedaCanciones");

    if(!lista || !busqueda){

        return;

    }

    let textoBusqueda = busqueda.value.trim();

    if(!textoBusqueda){

        lista.innerHTML = "";
        lista.classList.remove("visible");
        return;

    }

    let filtro = limpiar(textoBusqueda);
    let coincidencias = cancionesLetras.filter(cancion =>
        limpiar(cancion.titulo).includes(filtro)
    );

    lista.innerHTML = "";

    let estado = document.createElement("div");
    estado.className = "estado-resultados-canciones";
    estado.textContent = coincidencias.length === 0
        ? "No se encontraron canciones"
        : coincidencias.length +
          (coincidencias.length === 1
              ? " coincidencia"
              : " coincidencias");
    lista.appendChild(estado);

    coincidencias.forEach(cancion => {

        let resultado = document.createElement("button");
        resultado.type = "button";
        resultado.className = "resultado-cancion";
        resultado.textContent = cancion.titulo;
        resultado.addEventListener("click", () => {

            seleccionarCancionGuardada(cancion.id);

        });
        lista.appendChild(resultado);

    });

    lista.classList.add("visible");

}

function seleccionarCancionGuardada(id){

    let selector = document.getElementById("selectorCanciones");

    if(!selector){

        return;

    }

    selector.value = "local:" + id;
    cargarCancionSeleccionada();

    let busqueda = document.getElementById("busquedaCanciones");
    filtroCancionesGuardadas = "";

    if(busqueda){

        busqueda.value = "";

    }

    actualizarSelectorCanciones();
    renderizarResultadosCanciones();

}

function navegarCancionesGuardadas(event){

    let selector = document.getElementById("selectorCanciones");
    let busqueda = document.getElementById("busquedaCanciones");

    if(!selector){

        return;

    }

    let opciones = Array.from(selector.options)
        .filter(opcion => opcion.value);

    if(event.key === "ArrowDown"){

        event.preventDefault();

        let primerResultado = document.querySelector(
            "#resultadosCanciones.visible .resultado-cancion"
        );

        if(primerResultado){

            primerResultado.focus();
            return;

        }

        selector.focus();

        if(!selector.value && opciones.length > 0){

            selector.value = opciones[0].value;

        }

        return;

    }

    if(event.key === "Enter" && opciones.length > 0){

        let filtro = limpiar(busqueda ? busqueda.value : "");
        let opcion = opciones.find(item =>
            limpiar(item.textContent) === filtro
        ) || opciones[0];

        selector.value = opcion.value;
        cargarCancionSeleccionada();
        if(busqueda){

            busqueda.value = "";

        }
        filtroCancionesGuardadas = "";
        actualizarSelectorCanciones();
        renderizarResultadosCanciones();
        event.preventDefault();
        return;

    }

    if(event.key === "Escape" && busqueda){

        busqueda.value = "";
        filtroCancionesGuardadas = "";
        actualizarSelectorCanciones();
        renderizarResultadosCanciones();
        event.preventDefault();

    }

}

function cargarCancionSeleccionada(){

    let selector = document.getElementById("selectorCanciones");
    let valor = selector ? selector.value : "";

    if(!valor){

        cancionLetraActual = "";
        diapositivasLetras = [""];
        indiceDiapositivaLetra = 0;
        tamanoLetraActual = 64;
        animacionLetraActual = "olas";

        let titulo = document.getElementById("tituloCancion");

        if(titulo){

            titulo.value = "";

        }

        renderizarEditorLetras();
        return;

    }

    let id = valor.replace(/^local:/, "");
    let cancion = cancionesLetras.find(c => c.id === id);

    if(!cancion){

        actualizarSelectorCanciones();
        renderizarEditorLetras();
        return;

    }

    cancionLetraActual = valor;
    diapositivasLetras = [...cancion.diapositivas];
    indiceDiapositivaLetra = 0;
    tamanoLetraActual = cancion.tamano;
    animacionLetraActual = normalizarAnimacionLetra(cancion.animacion);

    let titulo = document.getElementById("tituloCancion");

    if(titulo){

        titulo.value = cancion.titulo;

    }

    renderizarEditorLetras();

}

function actualizarAnimacionCancion(){

    let selector = document.getElementById("animacionLetra");

    if(selector){

        animacionLetraActual = normalizarAnimacionLetra(selector.value);

    }

}

function renderizarListaDiapositivasLetras(){

    let lista = document.getElementById("listaDiapositivasLetras");

    if(!lista){

        return;

    }

    lista.innerHTML = "";

    diapositivasLetras.forEach((texto, i) => {

        let tarjeta = document.createElement("div");
        tarjeta.className = "diapositiva-card" +
            (i === indiceDiapositivaLetra ? " activa" : "");
        tarjeta.dataset.letraSlide = i;

        let nombre = document.createElement("strong");
        nombre.textContent = "Diapositiva " + (i + 1);

        let resumen = document.createElement("div");
        resumen.className = "diapositiva-resumen";
        resumen.textContent = texto.trim() || "(vacía)";

        tarjeta.appendChild(nombre);
        tarjeta.appendChild(resumen);
        tarjeta.addEventListener("click", () => {

            indiceDiapositivaLetra = i;
            renderizarEditorLetras();

        });

        lista.appendChild(tarjeta);

    });

}

function renderizarEditorLetras(){

    if(!Array.isArray(diapositivasLetras) ||
       diapositivasLetras.length === 0){

        diapositivasLetras = [""];
        indiceDiapositivaLetra = 0;

    }

    if(indiceDiapositivaLetra >= diapositivasLetras.length){

        indiceDiapositivaLetra = diapositivasLetras.length - 1;

    }

    tamanoLetraActual = Math.min(
        110,
        Math.max(32, Number(tamanoLetraActual) || 64)
    );

    renderizarListaDiapositivasLetras();

    let editor = document.getElementById("editorLetraDiapositiva");

    if(editor){

        editor.value = diapositivasLetras[indiceDiapositivaLetra] || "";

    }

    let rango = document.getElementById("tamanoLetraProy");

    if(rango){

        rango.value = tamanoLetraActual;

    }

    let animacion = document.getElementById("animacionLetra");

    if(animacion){

        animacion.value = animacionLetraActual;

    }

    actualizarPreviewLetra();

}

function actualizarDiapositivaActual(){

    let editor = document.getElementById("editorLetraDiapositiva");

    if(!editor || indiceDiapositivaLetra < 0 ||
       indiceDiapositivaLetra >= diapositivasLetras.length){

        return;

    }

    diapositivasLetras[indiceDiapositivaLetra] = editor.value;

    let tarjeta = document.querySelector(
        '[data-letra-slide="' + indiceDiapositivaLetra + '"] .diapositiva-resumen'
    );

    if(tarjeta){

        tarjeta.textContent =
            diapositivasLetras[indiceDiapositivaLetra].trim() || "(vacía)";

    }

    actualizarPreviewLetra();

}

function actualizarPreviewLetra(){

    let rango = document.getElementById("tamanoLetraProy");
    let valor = document.getElementById("valorTamanoLetra");
    let preview = document.getElementById("previewLetraDiapositiva");

    if(rango){

        tamanoLetraActual = Math.min(
            110,
            Math.max(32, Number(rango.value) || 64)
        );

    }

    if(valor){

        valor.textContent = tamanoLetraActual + "px";

    }

    if(preview){

        preview.textContent =
            diapositivasLetras[indiceDiapositivaLetra] || "Escribe una diapositiva";
        preview.style.fontSize = tamanoLetraActual + "px";

    }

}

function guardarCancion(){

    let tituloInput = document.getElementById("tituloCancion");
    let titulo = tituloInput ? tituloInput.value.trim() : "";

    if(!titulo){

        alert("Escribe el título de la canción");
        return;

    }

    let diapositivas = diapositivasLetras.map(texto =>
        String(texto || "").replace(/\r/g, "")
    );

    if(!diapositivas.some(texto => texto.trim())){

        alert("Escribe al menos una diapositiva");
        return;

    }

    cancionesLetras = leerCancionesLetras();

    let id = cancionLetraActual.replace(/^local:/, "");
    let posicion = id
        ? cancionesLetras.findIndex(cancion => cancion.id === id)
        : -1;

    if(posicion < 0){

        posicion = cancionesLetras.findIndex(cancion =>
            cancion.titulo.toLowerCase() === titulo.toLowerCase()
        );

    }

    if(posicion < 0){

        id = "cancion-" + Date.now();
        posicion = cancionesLetras.length;

    }else{

        id = cancionesLetras[posicion].id;

    }

    cancionesLetras[posicion] = {
        id,
        titulo,
        diapositivas,
        tamano: tamanoLetraActual,
        animacion: normalizarAnimacionLetra(animacionLetraActual)
    };

    if(!guardarCancionesLetras()){

        return;

    }

    cancionLetraActual = "local:" + id;
    filtroCancionesGuardadas = "";

    let busqueda = document.getElementById("busquedaCanciones");

    if(busqueda){

        busqueda.value = "";

    }

    actualizarSelectorCanciones();
    renderizarResultadosCanciones();

    let selector = document.getElementById("selectorCanciones");

    if(selector){

        selector.value = cancionLetraActual;

    }

    alert("Canción guardada");

}

function borrarCancionActual(){

    let id = cancionLetraActual.replace(/^local:/, "");

    if(!id){

        alert("Selecciona una canción guardada");
        return;

    }

    if(!confirm("¿Borrar esta canción?")){

        return;

    }

    cancionesLetras = leerCancionesLetras().filter(cancion =>
        cancion.id !== id
    );

    if(!guardarCancionesLetras()){

        return;

    }

    cancionLetraActual = "";
    diapositivasLetras = [""];
    indiceDiapositivaLetra = 0;
    tamanoLetraActual = 64;
    animacionLetraActual = "olas";
    filtroCancionesGuardadas = "";

    let titulo = document.getElementById("tituloCancion");

    if(titulo){

        titulo.value = "";

    }

    let busqueda = document.getElementById("busquedaCanciones");

    if(busqueda){

        busqueda.value = "";

    }

    actualizarSelectorCanciones();
    renderizarResultadosCanciones();
    renderizarEditorLetras();

}

function agregarDiapositivaLetra(){

    diapositivasLetras.push("");
    indiceDiapositivaLetra = diapositivasLetras.length - 1;
    renderizarEditorLetras();

}

function eliminarDiapositivaLetra(){

    if(diapositivasLetras.length === 1){

        diapositivasLetras[0] = "";

    }else{

        diapositivasLetras.splice(indiceDiapositivaLetra, 1);
        indiceDiapositivaLetra = Math.min(
            indiceDiapositivaLetra,
            diapositivasLetras.length - 1
        );

    }

    renderizarEditorLetras();

}

function obtenerDiapositivasEnOrden(){

    let ordenadas = [];

    diapositivasLetras.forEach((texto, orden) => {

        let contenido = String(texto || "").replace(/\r/g, "");

        if(contenido.trim()){

            ordenadas.push({
                orden,
                contenido
            });

        }

    });

    return ordenadas.map(diapositiva => diapositiva.contenido);

}

function iniciarProyeccionLetras(){

    let tituloInput = document.getElementById("tituloCancion");
    let titulo = tituloInput ? tituloInput.value.trim() : "";

    diapositivasProyeccionLetras = obtenerDiapositivasEnOrden();

    if(!titulo){

        alert("Escribe el título de la canción");
        return;

    }

    if(diapositivasProyeccionLetras.length === 0){

        alert("Escribe al menos una diapositiva");
        return;

    }

    indiceProyeccionLetra = 0;

    document.getElementById("proyCancionTitulo").textContent = titulo;
    aplicarAnimacionLetras();
    document.getElementById("proyeccionLetras").classList.add("activa");
    document.body.style.overflow = "hidden";

    actualizarProyeccionLetra();

}

function aplicarAnimacionLetras(){

    let proyeccion = document.getElementById("proyeccionLetras");

    if(!proyeccion){

        return;

    }

    ESTILOS_ANIMACION_LETRA.forEach(estilo => {

        proyeccion.classList.remove("animacion-" + estilo);

    });

    animacionLetraActual = normalizarAnimacionLetra(animacionLetraActual);
    proyeccion.classList.add("animacion-" + animacionLetraActual);

}

function renderizarPalabrasProyeccion(elemento, contenido){

    elemento.innerHTML = "";

    let fragmento = document.createDocumentFragment();
    let partes = String(contenido || "")
        .replace(/\r/g, "")
        .split(/(\s+)/);

    partes.forEach(parte => {

        if(!parte){

            return;

        }

        if(/^\s+$/.test(parte)){

            fragmento.appendChild(
                document.createTextNode(parte)
            );
            return;

        }

        let palabra = document.createElement("span");
        palabra.className = "palabra-proyeccion";
        palabra.textContent = parte;
        fragmento.appendChild(palabra);

    });

    elemento.appendChild(fragmento);

}

function actualizarProyeccionLetra(){

    let texto = document.getElementById("proySlideTexto");

    if(!texto || diapositivasProyeccionLetras.length === 0){

        return;

    }

    renderizarPalabrasProyeccion(
        texto,
        diapositivasProyeccionLetras[indiceProyeccionLetra]
    );

    texto.classList.remove("cambiando");
    void texto.offsetWidth;
    texto.classList.add("cambiando");

}

function anteriorSlideLetra(){

    if(indiceProyeccionLetra > 0){

        indiceProyeccionLetra--;
        actualizarProyeccionLetra();

    }

}

function siguienteSlideLetra(){

    if(indiceProyeccionLetra < diapositivasProyeccionLetras.length - 1){

        indiceProyeccionLetra++;
        actualizarProyeccionLetra();

    }

}

function salirProyeccionLetras(){

    let proyeccion = document.getElementById("proyeccionLetras");

    if(proyeccion){

        proyeccion.classList.remove("activa");
        ESTILOS_ANIMACION_LETRA.forEach(estilo => {

            proyeccion.classList.remove("animacion-" + estilo);

        });

    }

    document.body.style.overflow = "auto";

}

document.addEventListener("keydown", e => {

    let proyeccion = document.getElementById("proyeccionLetras");

    if(!proyeccion || !proyeccion.classList.contains("activa")){

        return;

    }

    if(e.key === "Escape"){

        salirProyeccionLetras();

    }else if(e.key === "ArrowLeft" || e.key === "ArrowDown"){

        anteriorSlideLetra();

    }else if(
        e.key === "ArrowRight" ||
        e.key === "ArrowUp"
    ){

        e.preventDefault();
        siguienteSlideLetra();

    }

});
